name: CI Infrastructure and Service Testing

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          services/ingestion/package-lock.json
          services/governance/package-lock.json
          services/payment/package-lock.json

    - name: Install Monorepo Root Dependencies
      run: npm install

    - name: Install Ingestion Service Dependencies
      run: npm ci --prefix services/ingestion

    - name: Install Governance Agent Dependencies
      run: npm ci --prefix services/governance

    - name: Install Payment Service Dependencies
      run: npm ci --prefix services/payment

    - name: Run Ingestion Service Suite
      run: npm test --prefix services/ingestion

    - name: Run Governance Agent Suite
      run: npm test --prefix services/governance

    - name: Run Payment Service Suite
      run: npm test --prefix services/payment

    - name: Create Secrets Mock Placements Environment File
      run: |
        echo "REDIS_PASSWORD=mock_redis_secure_pass" > .env
        echo "MONGO_DB=approvalflow" >> .env
        echo "🎉 Generated environment secrets manifest variables for cloud docker runtime loop context."

    - name: Start Live Infrastructure Mesh Grid via Docker Compose
      run: |
        docker compose up -d
        echo "⏳ Waiting for MongoDB Replica Set, Redis Server, and Dapr Sidecars boot cycles..."
        sleep 15
        
        echo "🔍 Polling Envoy API Gateway socket on port 8000 for verification healthcheck ready state..."
        timeout 60s sh -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/unknown-route | grep -E "404|200"; do echo "Envoy routing tables warming up... sleeping 3s"; sleep 3; done'
        
        echo "🚀 Infrastructure baseline network verified successfully!"
        docker compose ps

    - name: Run Distributed Live E2E Harness
      run: npm run test:e2e

    - name: Tear Down Infrastructure Environment
      if: always()
      run: |
        touch .env
        docker compose down --volumes --remove-orphans

  deploy-stage:
    needs: run-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Simulate Production Container Delivery
      run: |
        echo "🚀 Starting CD Deployment Stage Pipeline Automation..."
        echo "Compiling and validating Dockerfile layers blueprints..."
        docker build -f services/ingestion/Dockerfile --target=production -t approvalflow/ingestion:latest . --dry-run
        echo "🎉 CD simulation success! Ready for container registry propagation."
