apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: approval-pubsub 
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis:6379
    - name: redisPassword
      value: "your-redis-password"
    - name: consumerID
      value: approval-flow-group
    - name: enableTLS
      value: "false"
  auth:
    secretStore: approval-secret-store