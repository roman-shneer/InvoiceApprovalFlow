apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: mongo-invoices
spec:
  type: state.mongodb
  version: v1
  metadata:
    # ИСПРАВЛЕНО: Явно передаем хост и порт для инициализации драйвера Dapr
    - name: host
      value: "mongodb-db:27017"

    # СОХРАНЕНО: Безопасное вытягивание кредов из вашего secret store
    - name: connectionString
      secretKeyRef:
        name: mongodb-connection-string
        key: mongodb-connection-string  
    
    # СОХРАНЕНО СО СКРИНШОТА: Валидные Enterprise-имена коллекций
    - name: databaseName
      value: "approvalflow"

    - name: collectionName
      value: "invoices"

    - name: writeConcern
      value: "majority"

    - name: readConcern
      value: "majority"

    - name: operationTimeout
      value: "5s"
  auth:
    secretStore: approval-secret-store
