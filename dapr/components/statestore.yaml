apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: approval-state 
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis:6379
  - name: redisPassword
    value: "your-redis-password"
  - name: enableTLS
    value: "false"
  - name: keyPrefix
    value: "approvalflow:"
  - name: actorStateStore
    value: "true"
  