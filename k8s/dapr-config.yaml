        value: "budgets"

  mongo-users.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: mongo-users
    spec:
      type: state.mongodb
      version: v1
      metadata:
      - name: host
        value: "mongodb-db:27017"
      - name: databaseName
        value: "approvalflow"
      - name: collectionName
        value: "users"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address: { address: 0.0.0.0, port_value: 8000 }
          filter_chains:
          - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                  - name: local_service
                    domains: ["*"]
                    routes:
                    - match: { prefix: "/api/v1/expenses" }
                      route: { cluster: ingestion_cluster }
                http_filters:
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
      clusters:
      - name: ingestion_cluster
        connect_timeout: 0.25s
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: ingestion_cluster
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: { address: ingestion-service, port_value: 8001 }
