  mongo-budgets.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: mongo-budgets
    spec:
      type: state.mongodb
      version: v1
      metadata:
      - name: host
        value: "mongodb-db:27017"
