apiVersion: v1
kind: ConfigMap
metadata:
  name: pubsub-config
data:
  pubsub.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: approval-pubsub
    spec:
      type: pubsub.redis
      version: v1
      metadata:
      - name: redisHost
        value: redis:6379
      - name: redisPassword
        value: "your-redis-password"
      - name: consumerID
        value: "approval-flow-group2"
      - name: enableTLS
        value: "false"
      - name: rawPayload
        value: "true"
      - name: contentType
        value: "application/json"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: state-config
data:
  approval-state.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: approval-state
    spec:
      type: state.redis
      version: v1
      metadata:
      - name: redisHost
        value: redis:6379
      - name: redisPassword
        value: "your-redis-password"
      - name: actorStateStore
        value: "false"

  mongo-invoices.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Component
    metadata:
      name: mongo-invoices
    spec:
      type: state.mongodb
      version: v1
      metadata:
      - name: host
        value: "mongodb-db:27017"
      - name: databaseName
        value: "approvalflow"
      - name: collectionName
        value: "invoices"

  mongo-state.yaml: |
