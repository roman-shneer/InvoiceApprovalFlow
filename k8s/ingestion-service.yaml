### Governance & AI Service ###
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-service
  labels:
    app: governance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: governance-service
  template:
    metadata:
      labels:
        app: governance-service
    spec:
      containers:
      - name: app
        image: governance-service:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        env:
        - name: APP_PORT
          value: "8002"
        - name: DAPR_HTTP_HOST
          value: "127.0.0.1"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: OLLAMA_API_URL
          value: "http://ollama-service:11434"
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: approval-config
              key: mongo-db-name
        - name: AI_MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: approval-config
              key: ai-model-name
        - name: OLLAMA_HOST
          value: "http://ollama-service:11434"
      - name: dapr-sidecar
        image: ghcr.io/dapr/daprd:1.15.4
        command: ["/daprd"]
        args: ["--app-id", "governance-service", "--app-port", "8002", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components"]
        volumeMounts:
        - name: dapr-resources
          mountPath: /dapr/components
      volumes:
      - name: dapr-resources
        projected:
          sources:
          - configMap:
              name: pubsub-config
          - configMap:
              name: state-config
---
apiVersion: v1
kind: Service
metadata:
  name: governance-service
spec:
  selector:
    app: governance-service
  ports:
  - name: app-port
    protocol: TCP
    port: 8002
    targetPort: 8002
---
### Management UI Service ###
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-service
  labels:
    app: management-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-service
  template:
    metadata:
      labels:
        app: management-service
    spec:
      containers:
      - name: app
        image: management-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: APP_PORT
          value: "80"
        - name: DAPR_HTTP_HOST
          value: "127.0.0.1"
        - name: DAPR_HTTP_PORT
          value: "3500"
        - name: INVOICE_URL
          value: "http://api-gateway:8000/api/v1/expenses"
        - name: MONGO_DB
          valueFrom:
            configMapKeyRef:
              name: approval-config
              key: mongo-db-name
      - name: dapr-sidecar
        image: ghcr.io/dapr/daprd:1.15.4
        command: ["/daprd"]
        args: ["--app-id", "management-service", "--app-port", "80", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components"]
        volumeMounts:
        - name: dapr-resources
          mountPath: /dapr/components
      volumes:
      - name: dapr-resources
        projected:
          sources:
          - configMap:
              name: pubsub-config
          - configMap:
              name: state-config
---
apiVersion: v1
kind: Service
metadata:
  name: management-service
spec:
  selector:
    app: management-service
  ports:
  - name: app-port
    protocol: TCP
    port: 80
    targetPort: 80
---
