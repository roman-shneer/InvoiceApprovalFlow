apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-service
  labels:
    app: ollama-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-service
  template:
    metadata:
      labels:
        app: ollama-service
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        command: ["sh", "-c"]
        args:
        - |
          ollama serve &
          echo "Waiting for Ollama server to respond..."
          until ollama list > /dev/null 2>&1; do
            sleep 2
          done
          echo "Pulling target model: ${AI_MODEL_NAME}..."
          ollama pull ${AI_MODEL_NAME}
          echo "Pulling embed model: nomic-embed-text..."
          ollama pull nomic-embed-text
          echo "Model download complete! Keeping container alive..."
          wait $!
        env:
        - name: AI_MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: approval-config
              key: ai-model-name
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        # NOTE: For local testing emptyDir is fine, but PersistentVolumeClaim 
        # prevents redownloading models on pod restart.
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  selector:
    app: ollama-service
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434