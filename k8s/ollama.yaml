apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-service
  labels:
    app: ollama-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-service
  template:
    metadata:
      labels:
        app: ollama-service
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
        command: ["sh", "-c"]
        args:
        - |
          ollama serve &
          until ollama list > /dev/null 2>&1; do sleep 2; done
          if ! ollama list | grep -q "${AI_MODEL_NAME}"; then
            echo "Pulling ${AI_MODEL_NAME}..."
            ollama pull ${AI_MODEL_NAME}
          else
            echo "Model ${AI_MODEL_NAME} already exists, skipping pull"
          fi
          if ! ollama list | grep -q "nomic-embed-text"; then
            ollama pull nomic-embed-text
          fi
          wait $!
        env:
        - name: AI_MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: approval-config
              key: ai-model-name
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "8Gi"
            cpu: "4"
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  selector:
    app: ollama-service
  ports:
  - port: 11434
    targetPort: 11434