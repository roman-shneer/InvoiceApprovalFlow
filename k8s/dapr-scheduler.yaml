apiVersion: v1
kind: Service
metadata:
  name: dapr-scheduler
spec:
  selector:
    app: dapr-scheduler
  ports:
  - name: scheduler
    port: 50006
    targetPort: 50006
  - name: scheduler-http
    port: 50007
    targetPort: 50007
  - name: etcd
    port: 2379
    targetPort: 2379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapr-scheduler
  template:
    metadata:
      labels:
        app: dapr-scheduler
    spec:
      containers:
      - name: scheduler
        image: docker.io/daprio/scheduler:1.15.4
        imagePullPolicy: IfNotPresent
        command: ["./scheduler"]
        args:
            - "--etcd-data-dir=/data"
        ports:
          - containerPort: 50006
          - containerPort: 50007
          - containerPort: 2379
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}