apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init-script
data:
  init-collections.js: |
    db = db.getSiblingDB('approvalflow');
    # ... твой скрипт без изменений ...
    print("Collections initialization completed");
  init-replica.sh: |
    #!/bin/bash
    mongod --replSet rs0 --bind_ip_all --quiet --wiredTigerCacheSizeGB 0.25 &
    until mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
      echo 'Waiting for MongoDB...' && sleep 2;
    done
    mongosh --quiet --eval '
      try { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb-db:27017"}]}) } catch(e) {}
    '
    until mongosh --quiet --eval 'rs.isMaster().ismaster' | grep -q 'true'; do sleep 2; done
    if [ -f /init-collections.js ]; then
      mongosh --quiet approvalflow /init-collections.js
    fi
    wait
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-db
  labels:
    app: mongodb-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-db
  template:
    metadata:
      labels:
        app: mongodb-db
    spec:
      containers:
      - name: mongodb-db
        image: mongo:6.0
        command: ["/bin/bash", "/init-scripts/init-replica.sh"]
        env:
        - name: MONGO_INITDB_DATABASE
          value: "approvalflow"
        - name: MONGOSH_NO_TELEMETRY
          value: "1"
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        - name: mongosh-tmp
          mountPath: /root/.mongodb
        - name: scripts-volume
          mountPath: /init-scripts
        - name: collections-volume
          mountPath: /init-collections.js
          subPath: init-collections.js
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: mongosh-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 10Mi
      - name: scripts-volume
        configMap:
          name: mongodb-init-script
          defaultMode: 0755
      - name: collections-volume
        configMap:
          name: mongodb-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-db
spec:
  selector:
    app: mongodb-db
  ports:
  - port: 27017
    targetPort: 27017