### NETWORK BRIDGE ###
networks:
  approval-flow-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  ollama_data:
  scheduler-data:

services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - approval-flow-net
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb-db:
    image: mongo:6.0
    container_name: mongodb-db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGOSH_NO_TELEMETRY: "1"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db # ИМЕНОВАННЫЙ VOLUME, а не папка!
      - ./dapr/init-collections.js:/init-collections.js:ro
    tmpfs:
      - /root/.mongodb:mode=1777,size=10m # логи mongosh теперь в RAM, а не на SSD
    networks:
      - approval-flow-net
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      sh -c "
        mongod --replSet rs0 --bind_ip_all --quiet &
        until mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do sleep 2; done &&
        mongosh --quiet --eval 'try { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb-db:27017\"}]}) } catch(e) {}' &&
        sleep 2 &&
        mongosh --quiet < /init-collections.js &&
        wait
      "

  dapr-placement:
    image: "ghcr.io/dapr/placement:1.15.4"
    command: [ "/placement", "-port", "50005" ]
    networks: [ approval-flow-net ]
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  dapr-scheduler:
    image: "ghcr.io/dapr/scheduler:1.15.4"
    entrypoint: [ "/scheduler" ]
    command: [ "--etcd-data-dir=/data" ]
    user: "0:0"
    volumes:
      - scheduler-data:/data
    networks:
      - approval-flow-net
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

  api-gateway:
    image: envoyproxy/envoy:v1.28.0
    volumes:
      - ./gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8008:8000"
    networks:
      - approval-flow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # MICROSERVICES #
  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    environment:
      - APP_PORT=8001
      - DAPR_HOST=127.0.0.1
      - DAPR_HTTP_PORT=3500
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - approval-flow-net
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  ingestion-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    command: [ "/daprd", "--app-id", "ingestion-service", "--app-port", "8001", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--scheduler-host-address", "dapr-scheduler:50006", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components:ro
      - ./dapr:/dapr:ro
    network_mode: "service:ingestion-service"
    depends_on:
      mongodb-db: { condition: service_healthy }
      redis: { condition: service_healthy }
      ingestion-service: { condition: service_started }
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  governance-service:
    build: ./services/governance
    environment:
      - APP_PORT=8002
      - DAPR_HOST=127.0.0.1
      - DAPR_HTTP_PORT=3500
      - OLLAMA_API_URL=http://ollama-service:11434
    networks: [ approval-flow-net ]
    depends_on:
      redis: { condition: service_healthy }
      mongodb-db: { condition: service_healthy }
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  governance-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    command: [ "/daprd", "--app-id", "governance-service", "--app-port", "8002", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--scheduler-host-address", "dapr-scheduler:50006", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components:ro
      - ./dapr:/dapr:ro
    network_mode: "service:governance-service"
    depends_on:
      dapr-placement: { condition: service_started }
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  ollama-service:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - approval-flow-net
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  ollama-model-puller:
    image: curlimages/curl:latest
    networks:
      - approval-flow-net
    depends_on:
      - ollama-service
    restart: "no"
    entrypoint: [ "sh", "-c", "until curl -s http://ollama-service:11434/api/tags > /dev/null; do echo 'Waiting for Ollama...'; sleep 5; done; curl -X POST http://ollama-service:11434/api/pull -d \"{\\\"name\\\": \\\"${AI_MODEL_NAME}\\\"}\"; curl -X POST http://ollama-service:11434/api/pull -d \"{\\\"name\\\": \\\"${AI_EMBEDDING_MODEL_NAME}\\\"}\"" ]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

  management-service:
    build:
      context: ./services/management
      dockerfile: Dockerfile
    container_name: management-service
    ports:
      - "80:80"
    env_file: [ .env ]
    environment:
      - APP_PORT=80
    depends_on:
      mongodb-db: { condition: service_healthy }
    restart: on-failure
    networks:
      - approval-flow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  management-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    command: [ "/daprd", "--app-id", "management-service", "--app-port", "80", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components:ro
      - ./dapr:/dapr:ro
    network_mode: "service:management-service"
    depends_on:
      mongodb-db: { condition: service_healthy }
      management-service: { condition: service_started }
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  payment-service:
    build:
      context: ./services/payment
      dockerfile: Dockerfile
    container_name: payment-service
    environment:
      - APP_PORT=8010
    depends_on:
      mongodb-db: { condition: service_healthy }
    restart: on-failure
    networks:
      - approval-flow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  payment-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    command: [ "/daprd", "--app-id", "payment-service", "--app-port", "8010", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components:ro
      - ./dapr:/dapr:ro
    network_mode: "service:payment-service"
    depends_on:
      mongodb-db: { condition: service_healthy }
      payment-service: { condition: service_started }
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"
    networks:
      - approval-flow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
