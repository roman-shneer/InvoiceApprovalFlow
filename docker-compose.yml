### NETWORK BRIDGE ###
networks:
  approval-flow-net:
    driver: bridge

services:
  # INFRASTRUCTURE #

  ## REDIS ##
  redis:
    image: redis/redis-stack-server:latest
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - approval-flow-net

  ## MONGODB ##
  mongodb-db:
    image: mongo:6.0
    container_name: mongodb-db
    hostname: mongodb-db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
      - ./dapr/init-collections.js:/init-collections.js:ro
    networks:
      - approval-flow-net
    restart: always
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command: >
      sh -c "
        mongod --replSet rs0 --bind_ip_all --quiet &
        until mongosh --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
          echo 'Waiting for MongoDB...' && sleep 2;
        done &&
        echo 'MongoDB is up!' &&
        mongosh --quiet --eval '
          try {
            rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb-db:27017\"}]});
            print(\"Replica set initiated\");
          } catch(e) {
            print(\"rs.initiate skipped: \" + e.message);
          }
        ' &&
        sleep 2 &&
        mongosh --quiet < /init-collections.js &&
        echo 'Init complete' &&
        wait
      "

  ## DAPR PLACEMENT ##
  dapr-placement:
    image: "ghcr.io/dapr/placement:1.15.4"
    command: [ "/placement", "-port", "50005" ]
    ports:
      - "50005:50005"
    networks:
      - approval-flow-net

  ## ENVOY REVERSE PROXY GATEWAY ##
  api-gateway:
    image: envoyproxy/envoy:v1.28.0
    volumes:
      - ./gateway/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "8008:8000"
    depends_on:
      - ingestion-service
    networks:
      - approval-flow-net

  # MICROSERVICES #

  ### Ingestion Service ###
  ingestion-service:
    build:
      context: .
      dockerfile: ./services/ingestion/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - APP_PORT=8001
      - DAPR_HTTP_HOST=127.0.0.1
      - DAPR_HTTP_PORT=3500
    depends_on:
      redis:
        condition: service_started
    networks:
      - approval-flow-net

  ingestion-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    container_name: ingestion-dapr-sidecar
    command: [ "/daprd", "--app-id", "ingestion-service", "--app-port", "8001", "--app-channel-address", "ingestion-service", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components
      - ./dapr:/dapr
    depends_on:
      mongodb-db:
        condition: service_healthy
      ingestion-service:
        condition: service_started
      dapr-placement:
        condition: service_started
    networks:
      - approval-flow-net

  ### Governance & AI Service ###
  governance-service:
    build:
      context: .
      dockerfile: ./services/governance/Dockerfile
    ports:
      - "8002:8002"
    container_name: governance-service
    hostname: governance-service
    environment:
      - APP_PORT=8002
      - DAPR_HTTP_HOST=127.0.0.1
      - DAPR_HTTP_PORT=3500
      - MONGO_DB=approvalflow
      - AI_MODEL_NAME=${AI_MODEL_NAME}
    volumes:
      - ./services/governance:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_started
      mongodb-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - approval-flow-net

  governance-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    container_name: governance-dapr-sidecar
    command: [ "/daprd", "--app-id", "governance-service", "--app-port", "8002", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components
      - ./dapr:/dapr
    depends_on:
      mongodb-db:
        condition: service_healthy
      governance-service:
        condition: service_started
      dapr-placement:
        condition: service_started
    network_mode: "service:governance-service"
    ### Ollama service ###
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "11434:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - AI_MODEL_NAME=${AI_MODEL_NAME}
      - DAPR_GRPC_PORT=50001
    volumes:
      - ./ollama_data:/root/.ollama
      - ./docs/policy.md:/app/docs/policy.md
      - ./sample-invoices.json:/app/docs/sample-invoices.json
    networks:
      - approval-flow-net

  ai-service-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    container_name: ai-service-dapr-sidecar
    depends_on:
      mongodb-db:
        condition: service_healthy
      ai-service:
        condition: service_started
      dapr-placement:
        condition: service_started
    command: [ "/daprd", "--app-id", "ai-service", "--app-port", "5001", "--app-protocol", "grpc", "--dapr-grpc-port", "50001", "--components-path", "/dapr/components" ]
    volumes:
      - "./dapr/components:/dapr/components"
      - "./dapr/:/dapr/"
    network_mode: "service:ai-service"
    #ollama-service:
    #  image: ollama/ollama:latest
    #  ports:
    #    - "11434:11434"
    #  volumes:
    #    - ./ollama_data:/root/.ollama
    # networks:
    #    - approval-flow-net

    ### Ollama model puller ###
    #ollama-model-puller:
    #image: curlimages/curl:latest
    #networks:
    #  - approval-flow-net
    #depends_on:
    #  - ollama-service
    #restart: "no"
    #entrypoint: [ "sh", "-c", "until curl -s http://ollama-service:11434/api/tags > /dev/null; do echo 'Waiting for Ollama...'; sleep 5; done; echo 'Ollama is up! Pulling target model...'; curl -X POST http://ollama-service:11434/api/pull -d \"{\\\"name\\\": \\\"${AI_MODEL_NAME}\\\"}\"" ]

    ### Management UI Service ###
  management-service:
    build:
      context: .
      dockerfile: ./services/management/Dockerfile
    container_name: management-service
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - APP_PORT=80
      - DAPR_HTTP_HOST=127.0.0.1
      - DAPR_HTTP_PORT=3500
      - INVOICE_URL=http://api-gateway:8000/api/v1/expenses
    volumes:
      - ./services/management/backend:/app
      - /app/node_modules
      - /app/public
    depends_on:
      mongodb-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - approval-flow-net

  management-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    container_name: management-dapr-sidecar
    command: [ "/daprd", "--app-id", "management-service", "--app-port", "80", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components
      - ./dapr:/dapr
    depends_on:
      mongodb-db:
        condition: service_healthy
      management-service:
        condition: service_started
      dapr-placement:
        condition: service_started
    restart: on-failure
    network_mode: "service:management-service"

  ### Payment Service ###
  payment-service:
    build:
      context: .
      dockerfile: ./services/payment/Dockerfile
    container_name: payment-service
    ports:
      - "8010:8010"
    environment:
      - APP_PORT=8010
      - DAPR_HTTP_HOST=127.0.0.1
      - DAPR_HTTP_PORT=3500
    volumes:
      - ./services/payment:/app
      - /app/node_modules
    depends_on:
      mongodb-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - approval-flow-net

  payment-dapr-sidecar:
    image: "ghcr.io/dapr/daprd:1.15.4"
    container_name: payment-dapr-sidecar
    command: [ "/daprd", "--app-id", "payment-service", "--app-port", "8010", "--app-channel-address", "127.0.0.1", "--placement-host-address", "dapr-placement:50005", "--resources-path", "/dapr/components", "--config", "/dapr/config.yaml" ]
    volumes:
      - ./dapr/components:/dapr/components
      - ./dapr:/dapr
    depends_on:
      mongodb-db:
        condition: service_healthy
      payment-service:
        condition: service_started
      dapr-placement:
        condition: service_started
    network_mode: "service:payment-service"

  ## OPEN TELEMETRY TRACING VISUALIZER ##
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: approval-flow-zipkin
    ports:
      - "9411:9411"
    networks:
      - approval-flow-net
