networks:
  approval-flow-net:
    driver: bridge

services:

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - approval-flow-net

  mongodb-db:
    image: mongo:6.0
    container_name: mongodb-db
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    networks:
      - approval-flow-net

  dapr-placement:
    image: "daprio/placement:1.13.0"
    command: [ "/placement", "-port", "50005" ]
    ports:
      - "50005:50005"
    networks:
      - approval-flow-net

  #api-gateway:
  #  image: envoyproxy/envoy:v1.28.0
  #  volumes:
  #    - ./gateway/envoy.yaml:/etc/envoy/envoy.yaml
  #  ports:
  #    - "8000:8000"
  #  depends_on:
  #    - ingestion-service
  #  networks:
  #    - approval-flow-net

  ### Ollama service ###
  ollama-service:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - approval-flow-net
  ### Ollama model ###
  ollama-model-puller:
    image: curlimages/curl:latest
    networks:
      - approval-flow-net
    depends_on:
      - ollama-service
    restart: "no"
    entrypoint: [ "sh", "-c", "until curl -s http://ollama-service:11434/api/tags > /dev/null; do echo 'Waiting for Ollama...'; sleep 5; done; echo 'Ollama is up! Pulling llama3...'; curl -X POST http://ollama-service:11434/api/pull -d '{\"name\": \"llama3\"}'" ]
